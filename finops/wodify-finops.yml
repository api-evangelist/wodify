meters:
- name: location_subscription
  description: Monthly per-location subscription fee for the chosen Wodify tier.
  unit: locations
  aggregation: sum
  dimensions:
  - account
  - location
  - tier
- name: pulse_addon
  description: Optional Wodify Pulse performance-tracking add-on.
  unit: locations
  aggregation: sum
  dimensions:
  - account
  - location
- name: payment_processing
  description: Transaction fees on member payments processed through Wodify (card and ACH).
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - location
  - method
principles:
- name: Visibility
  description: Track subscription cost per location and tier, add-ons, and payment-processing fees per location and payment method.
- name: Allocation
  description: Map per-location subscriptions and processing fees to individual gyms or franchise units.
- name: Optimization
  description: Right-size the plan tier to the features actually used, steer eligible member payments to lower-fee ACH, and drop add-ons that are not delivering value.
- name: Accountability
  description: Assign an owner per location; review monthly subscription plus processing spend against membership revenue.
