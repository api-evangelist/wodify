description: >-
  FinOps view of Wodify spend. Wodify is a per-location SaaS subscription
  (Essentials, Accelerate, Ultimate) with an optional Pulse performance-tracking
  add-on, plus usage-based payment-processing fees on member transactions. The
  API is not separately metered - API access is included with the platform
  subscription (the Workflows feature issues an API key), so the cost drivers are
  the number of gym locations, the chosen tier, any add-ons, and the volume and
  mix (card vs ACH) of member payments processed through Wodify.
notes: >-
  Per-unit rates are not reconciled here; verify on wodify.com/pricing. The
  dominant, variable cost for most operators is payment-processing fees, which
  scale with member billing volume rather than with API usage.
