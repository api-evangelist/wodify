name: Wodify
kind: company
description: Wodify is gym, fitness, and CrossFit box management software covering
  membership management, billing, class scheduling, lead and client CRM, digital
  waivers, and workout/performance tracking. The Wodify API is a REST interface at
  https://api.wodify.com/v1, authenticated with an x-api-key header, that lets
  partners and gym operators manage leads, clients, memberships, classes, programs,
  services, appointments, workouts, financials, and communications programmatically.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: true
  try_now: true
  public: false
  label: Paid (free trial) · Self-serve signup
  confidence: high
